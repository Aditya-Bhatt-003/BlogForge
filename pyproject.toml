[project]
name = "FastAPI-Blog"
version = "0.1.0"
description = "FastAPI Blog Project"
readme = "README.md"
authors = [
    { name = "Aditya-Bhatt-003", email = "adityabhatt3393@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "boto3>=1.43.115",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
]


